[project]
name = "expense-report"
version = "0.1.0"
description = "CSV gastos mini-report (Spec Kit practice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
expense-report = "expense_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_report"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
